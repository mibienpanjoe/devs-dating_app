version: '3.8'

services:
  app:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/node_modules
      - uploads:/app/uploads
    environment:
      - MONGO_URI=mongodb://mongodb:27017/devstinder
    networks:
      - app-network

  mongodb:
    image: mongo:6
    ports:
      - "27019:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  mongodb_data:
  uploads:

networks:
  app-network:
    driver: bridge